<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escanear refri · Nomi</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tema.js"></script>
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="barra-navegacion">
        <a class="logo" href="dashboard.html">nomi<span>.</span></a>
        <ul>
            <li><a class="enlace-menu" href="dashboard.html">Mi semana</a></li>
            <li><a class="enlace-menu" href="menu.html">Menú</a></li>
            <li><a class="enlace-menu" href="recetas.html">Recetas</a></li>
        </ul>
        <a class="boton boton-principal boton-chico" href="escanear_refri.html" aria-current="page">Escanear refri</a>
        <div class="grupo-usuario">
            <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">
                <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
            <a class="avatar" id="avatar" href="perfil.html" title="Perfil" style="text-decoration: none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
        </div>
    </nav>

    <main class="contenedor contenido-pagina">

        <span class="etiqueta">Escanear refri</span>
        <h1 class="titulo-seccion">¿Qué hay en tu refri?</h1>

        <!-- Formulario y carga de foto -->
        <div class="dos-columnas">

            <!-- Foto del refri -->
            <div class="caja-prueba">
                <label class="foto-vacia foto-refri" for="foto" id="zona-foto">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
                    <span>Toma o sube una foto de tu refri</span>
                    <img id="vista-foto" alt="Foto de tu refri" hidden>
                </label>
                <input id="foto" type="file" accept="image/*" capture="environment" hidden>

                <div class="encabezado-pagina" style="margin-top: var(--espacio-medio); align-items: center">
                    <small style="color: var(--color-texto-suave)" id="nombre-foto">Sin foto</small>
                    <label class="boton boton-secundario boton-chico" for="foto">Elegir foto</label>
                </div>
            </div>

            <!-- Formulario de ingredientes -->
            <form class="tarjeta" id="formulario-ingredientes" novalidate style="display: flex; flex-direction: column; gap: var(--espacio-medio)">

                <div class="encabezado-pagina" style="align-items: baseline">
                    <h3>Ingredientes</h3>
                    <span class="etiqueta" id="contador">0 seleccionados</span>
                </div>

                <div id="lista-ingredientes">
                    <p id="sin-ingredientes" style="margin: 0">Agrega los ingredientes que tienes en tu refri.</p>
                </div>

                <div class="fila-campos">
                    <div class="campo" id="campo-nombre">
                        <label for="nuevo-nombre">Ingrediente</label>
                        <input class="entrada" id="nuevo-nombre" placeholder="Ej. huevo" autocomplete="off">
                    </div>
                    <div class="campo">
                        <label for="nueva-cantidad">Cantidad</label>
                        <input class="entrada" id="nueva-cantidad" placeholder="Ej. 12 piezas" autocomplete="off">
                    </div>
                </div>
                <button class="boton boton-secundario boton-chico" type="button" id="boton-agregar" style="align-self: flex-start">+ Agregar ingrediente</button>

                <div class="fila-campos">
                    <div class="campo" id="campo-personas">
                        <label for="personas">Personas</label>
                        <input class="entrada" id="personas" type="number" min="1" placeholder="Ej. 2" inputmode="numeric">
                    </div>
                    <div class="campo" id="campo-comidas">
                        <label for="comidas">Comidas por día</label>
                        <input class="entrada" id="comidas" type="number" min="1" max="3" placeholder="De 1 a 3" inputmode="numeric">
                    </div>
                </div>

                <div class="grupo-botones" style="margin-top: 0">
                    <button class="boton boton-principal" type="submit" id="boton-generar">Generar menú de la semana</button>
                    <a class="boton boton-secundario" href="dashboard.html">Cancelar</a>
                </div>

                <div class="mensaje" id="resultado" hidden></div>
            </form>

        </div>

        <!-- Historial de fotos -->
        <section style="margin-top: var(--espacio-lateral)">
            <div class="encabezado-pagina">
                <div>
                    <span class="etiqueta">AWS Rekognition</span>
                    <h2 class="titulo-seccion" style="font-size: 20px; margin-top: 4px;">Historial de escaneos</h2>
                </div>
            </div>

            <div class="mensaje mensaje-error" id="error" hidden></div>

            <div class="cuadricula-3" id="historialContainer" style="margin-top: var(--espacio-medio)">
                <p>Cargando tus escaneos...</p>
            </div>
        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/escanear_refri.js"></script>
</body>
</html>
