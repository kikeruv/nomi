<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receta · Nomi</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tema.js"></script>
</head>
<body>

    <!-- Barra de navegación (con sesión) -->
    <nav class="barra-navegacion">
        <a class="logo" href="dashboard.html">nomi<span>.</span></a>
        <ul>
            <li><a class="enlace-menu" href="dashboard.html">Mi semana</a></li>
            <li><a class="enlace-menu" href="menu.html">Menú</a></li>
            <li><a class="enlace-menu" href="recetas.html" aria-current="page">Recetas</a></li>
        </ul>
        <a class="boton boton-principal boton-chico" href="escanear_refri.html">Escanear refri</a>
        <div class="grupo-usuario">
            <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">
                <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
            <!-- La inicial la pone el JS con el nombre del usuario -->
            <a class="avatar" id="avatar" href="perfil.html" title="Perfil" style="text-decoration: none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
        </div>
    </nav>

    <!-- Lo llena js/receta.js -->
    <main class="contenedor contenido-pagina">

        <a class="enlace" href="recetas.html" style="font-size: 14px">← Recetas</a>

        <div id="contenido-receta">
            <div class="dos-columnas" style="margin-top: var(--espacio-tarjeta)">
                <div class="imagen-principal" id="imagen"><i></i></div>

                <div>
                    <div class="macros" style="margin-top: 0" id="chips">
                        <span class="chip" id="categoria"></span>
                    </div>
                    <h1 class="titulo-seccion" id="titulo" style="margin-top: var(--espacio-medio)"></h1>
                    <p style="color: var(--color-texto-suave); margin: 12px 0 0" id="descripcion"></p>

                    <div class="cuadricula-4" style="margin-top: var(--espacio-tarjeta)">
                        <div><span class="etiqueta">Por porción</span><div class="dato" style="color: var(--color-verde-texto)"><span id="calorias">—</span><small> kcal</small></div></div>
                        <div><span class="etiqueta">Tiempo</span><div class="dato" id="tiempo">—</div></div>
                        <div><span class="etiqueta">Porciones</span><div class="dato" id="porciones">—</div></div>
                        <div><span class="etiqueta">Del refri</span><div class="dato" id="del-refri">—</div></div>
                    </div>

                    <div class="macros" id="macros"></div>

                    <div class="grupo-botones" style="margin-top: var(--espacio-tarjeta)">
                        <a class="boton boton-principal" href="menu.html">Ver mi menú</a>
                        <a class="boton boton-secundario" href="recetas.html">Ver otras recetas</a>
                    </div>
                </div>
            </div>

            <div class="dos-columnas" style="margin-top: 48px">
                <div>
                    <span class="etiqueta">Preparación</span>
                    <ol class="lista-pasos" id="pasos"></ol>
                </div>
                <div class="tarjeta">
                    <h3>Ingredientes</h3>
                    <ul class="lista-ingredientes" id="ingredientes"></ul>
                </div>
            </div>
        </div>

        <!-- Si la receta no existe -->
        <div class="tarjeta" id="no-encontrada" hidden style="margin-top: var(--espacio-tarjeta)">
            <h3>No encontramos esta receta</h3>
            <p>Puede que el enlace esté mal o que la receta ya no exista.</p>
            <a class="boton boton-secundario boton-chico" href="recetas.html" style="margin-top: var(--espacio-medio)">Ver recetas</a>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/receta.js"></script>
</body>
</html>
