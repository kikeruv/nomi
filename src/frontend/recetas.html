<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recetas · Nomi</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tema.js"></script>
</head>
<body>

    <!-- Barra de navegación (con sesión) -->
    <nav class="barra-navegacion">
        <a class="logo" href="dashboard.html">nomi<span>.</span></a>
        <ul>
            <li><a class="enlace-menu" href="dashboard.html">Mi semana</a></li>
            <li><a class="enlace-menu" href="menu.html">Menú</a></li>
            <li><a class="enlace-menu" href="recetas.html" aria-current="page">Recetas</a></li>
        </ul>
        <a class="boton boton-principal boton-chico" href="escanear_refri.html">Escanear refri</a>
        <div class="grupo-usuario">
            <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">
                <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            </button>
            <!-- La inicial la pone el JS con el nombre del usuario -->
            <a class="avatar" id="avatar" href="perfil.html" title="Perfil" style="text-decoration: none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
        </div>
    </nav>

    <main class="contenedor contenido-pagina">

        <div class="encabezado-pagina">
            <div>
                <span class="etiqueta">Recetas</span>
                <h1 class="titulo-seccion">Recetas con lo que tienes</h1>
            </div>
            <input class="entrada" id="buscador" type="search" placeholder="Buscar receta o ingrediente" style="max-width: 320px">
        </div>

        <!-- Filtros: data-categoria es la categoría de la tabla Recetario -->
        <div class="encabezado-pagina" style="margin-top: var(--espacio-tarjeta); align-items: center">
            <div class="filtros">
                <button class="filtro" type="button" data-categoria="todas" aria-pressed="true">Todas</button>
                <button class="filtro" type="button" data-categoria="desayuno" aria-pressed="false">Desayuno</button>
                <button class="filtro" type="button" data-categoria="comida" aria-pressed="false">Comida</button>
                <button class="filtro" type="button" data-categoria="cena" aria-pressed="false">Cena</button>
            </div>
            <a class="enlace" href="#" id="solo-caben">Menos de 500 kcal →</a>
        </div>

        <!-- Una .tarjeta por receta; las pinta js/recetas.js -->
        <div class="cuadricula-4" id="lista-recetas" style="margin-top: var(--espacio-tarjeta)"></div>

        <div class="mensaje mensaje-error" id="error" hidden></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/recetas.js"></script>
</body>
</html>
