<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · Nomi</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="pantalla-acceso">

        <!-- Lado izquierdo: mensaje de marca -->
        <div class="acceso-lado">
            <a class="logo" href="index.html">nomi<span>.</span></a>
            <div>
                <h2 class="titulo-acceso">Toma una foto. <em>Conoce</em> tus calorías.</h2>
                <p class="texto-intro">Registra cada comida con una foto y ve cuánto te queda de tu meta del día.</p>
            </div>
            <span class="etiqueta">Proyecto final · Desarrollo en la Nube · ITESO</span>
        </div>

        <!-- Lado derecho: formulario -->
        <form class="acceso-formulario" id="formulario-registro" novalidate>
            <span class="etiqueta">Crear cuenta</span>
            <h1 class="titulo-seccion">Crea tu cuenta</h1>

            <div class="campo" id="campo-nombre">
                <label for="nombre">Nombre</label>
                <input class="entrada" id="nombre" placeholder="Tu nombre" autocomplete="name">
                <small></small>
            </div>

            <div class="campo" id="campo-correo">
                <label for="correo">Correo</label>
                <input class="entrada" id="correo" type="email" placeholder="tu@correo.com" autocomplete="email">
                <small></small>
            </div>

            <div class="campo" id="campo-contrasena">
                <label for="contrasena">Contraseña</label>
                <input class="entrada" id="contrasena" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                <small></small>
            </div>

            <div class="fila-campos">
                <div class="campo" id="campo-edad">
                    <label for="edad">Edad</label>
                    <input class="entrada" id="edad" type="number" min="1" placeholder="21" inputmode="numeric">
                    <small></small>
                </div>
                <div class="campo" id="campo-presupuesto">
                    <label for="presupuesto">Presupuesto semanal</label>
                    <input class="entrada" id="presupuesto" type="number" min="1" placeholder="800" inputmode="numeric">
                    <small></small>
                </div>
            </div>

            <div class="campo" id="campo-meta">
                <label for="meta">Meta diaria de calorías</label>
                <input class="entrada" id="meta" type="number" min="1" value="2000" inputmode="numeric">
                <small data-ayuda="Puedes cambiarla después en tu perfil.">Puedes cambiarla después en tu perfil.</small>
            </div>

            <button class="boton boton-principal boton-completo" type="submit">Crear cuenta</button>

            <div class="separador">o</div>

            <button class="boton boton-secundario boton-completo" type="button">Continuar con Google</button>

            <p class="texto-centro">¿Ya tienes cuenta? <a class="enlace" href="login.html">Iniciar sesión</a></p>
        </form>

    </div>

    <script src="js/crear_cuenta.js"></script>
</body>
</html>
