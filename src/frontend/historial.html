<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial · Nomi</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Barra de navegación (con sesión) -->
    <nav class="barra-navegacion">
        <a class="logo" href="dashboard.html">nomi<span>.</span></a>
        <ul>
            <li><a class="enlace-menu" href="dashboard.html">Hoy</a></li>
            <li><a class="enlace-menu" href="historial.html" aria-current="page">Historial</a></li>
            <li><a class="enlace-menu" href="recetas.html">Recetas</a></li>
        </ul>
        <div class="grupo-acceso">
            <a class="boton boton-principal boton-chico" href="registrar_comida.html">Registrar comida</a>
            <a class="avatar" href="perfil.html" title="Perfil" style="text-decoration: none">A</a>
        </div>
    </nav>

    <main class="contenedor contenido-pagina">

        <!-- Encabezado con filtros -->
        <div class="encabezado-pagina">
            <div>
                <span class="etiqueta">Historial</span>
                <h1 class="titulo-seccion">Tus calorías, de un vistazo</h1>
                <span class="etiqueta" id="modo" style="color: var(--color-aviso)"></span>
            </div>
            <div class="filtros">
                <button class="filtro" type="button" data-dias="7" aria-pressed="true">Semana</button>
                <button class="filtro" type="button" data-dias="30" aria-pressed="false">Mes</button>
                <button class="filtro" type="button" data-dias="90" aria-pressed="false">3 meses</button>
            </div>
        </div>

        <div class="mensaje mensaje-error" id="error" hidden></div>

        <!-- Resumen -->
        <div class="cuadricula-4">
            <div class="tarjeta">
                <span class="etiqueta">Hoy</span>
                <div class="dato" id="dato-hoy">—</div>
            </div>
            <div class="tarjeta">
                <span class="etiqueta">Promedio diario</span>
                <div class="dato" id="dato-promedio">—</div>
            </div>
            <div class="tarjeta">
                <span class="etiqueta">Días en la meta</span>
                <div class="dato" id="dato-meta">—</div>
            </div>
            <div class="tarjeta">
                <span class="etiqueta">Comidas registradas</span>
                <div class="dato" id="dato-comidas">—</div>
            </div>
        </div>

        <!-- Gráfica de los últimos 7 días -->
        <div class="tarjeta" style="margin-top: var(--espacio-medio)">
            <div class="encabezado-pagina">
                <h3>Últimos 7 días</h3>
                <span class="etiqueta" id="etiqueta-meta" style="color: var(--color-aviso)"></span>
            </div>
            <svg class="grafica" id="grafica" viewBox="0 0 1080 220" width="100%" role="img" aria-label="Calorías de los últimos 7 días"></svg>
        </div>

        <!-- Tabla por día -->
        <div class="tarjeta" style="margin-top: var(--espacio-medio)">
            <h3>Por día</h3>
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Comidas</th>
                        <th>Estado</th>
                        <th class="numero">Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-dias">
                    <tr><td colspan="4">Cargando…</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Comidas recientes -->
        <section style="margin-top: var(--espacio-lateral)">
            <span class="etiqueta">Comidas recientes</span>
            <div class="cuadricula-3" id="comidas" style="margin-top: var(--espacio-medio)"></div>
        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/historial.js"></script>
</body>
</html>
