<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Nomi</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tema.js"></script>
</head>
<body>

    <div class="pantalla-acceso">

        <!-- Lado izquierdo (se oculta en celular) -->
        <div class="acceso-lado">
            <a class="logo" href="index.html">nomi<span>.</span></a>
            <div>
                <h2 class="titulo-acceso">Tómale foto a tu refri. <em>Come</em> toda la semana.</h2>
                <p class="texto-intro">Un menú de 7 días con lo que ya tienes en tu refri.</p>
            </div>
            <span class="etiqueta">Proyecto final · Desarrollo en la Nube · ITESO</span>
        </div>

        <!-- Lado derecho: botón de tema y formulario -->
        <div class="acceso-principal">
            <div class="acceso-arriba">
                <button class="boton-tema" id="boton-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">
                    <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                </button>
            </div>

            <form class="acceso-formulario" id="formulario-acceso" novalidate>
                <a class="logo logo-celular" href="index.html">nomi<span>.</span></a>
                <span class="etiqueta">Iniciar sesión</span>
                <h1 class="titulo-seccion">Hola de nuevo</h1>

                <div class="campo" id="campo-correo">
                    <label for="correo">Correo</label>
                    <input class="entrada" id="correo" type="email" placeholder="tu@correo.com" autocomplete="email">
                    <small></small>
                </div>

                <div class="campo" id="campo-contrasena">
                    <label for="contrasena">Contraseña</label>
                    <input class="entrada" id="contrasena" type="password" autocomplete="current-password">
                    <small></small>
                </div>

                <button class="boton boton-principal boton-completo" type="submit">Iniciar sesión</button>

                <p class="texto-centro">¿No tienes cuenta? <a class="enlace" href="crear_cuenta.html">Crear cuenta</a></p>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
